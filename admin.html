<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Ansh Raj</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.glass {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900 flex items-center justify-center p-6">

<div class="w-full max-w-2xl glass rounded-3xl shadow-2xl p-8 text-white border border-white/20">

<h1 class="text-3xl font-extrabold mb-8 text-center">
🚀 Admin Dashboard
</h1>

<form id="uploadForm" class="space-y-6">

<div>
<label class="block mb-2 font-semibold">Project Title</label>
<input type="text" id="title" required
class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-400">
</div>

<div>
<label class="block mb-2 font-semibold">Description</label>
<textarea id="description" required
class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
</div>

<div>
<label class="block mb-2 font-semibold">Category</label>
<input type="text" id="category"
class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-400">
</div>

<div>
<label class="block mb-2 font-semibold">Upload Image / Video</label>
<input type="file" id="fileInput" accept="image/*,video/*"
class="w-full text-sm text-gray-300">
</div>

<button type="submit"
class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl font-bold hover:scale-105 transition">
Upload Project
</button>

<div id="status" class="text-center font-semibold mt-4"></div>

</form>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyioNxRkJgxzyVNakfRzCuq2R_68Knlj7D8cwFy8UdM_LKCEldIqYU8Bb_8ay0cTsRK9A/exec";

document.getElementById("uploadForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;
  const category = document.getElementById("category").value;
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.innerHTML = "❌ Please select a file";
    status.className = "text-red-400 text-center mt-4";
    return;
  }

  status.innerHTML = "Uploading...";
  status.className = "text-yellow-400 text-center mt-4";

  const reader = new FileReader();

  reader.onload = function() {
    const base64Data = reader.result.split(",")[1];

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        title: title,
        description: description,
        category: category,
        fileBase64: base64Data,
        fileName: file.name,
        fileType: file.type
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        status.innerHTML = "✅ Upload Successful!";
        status.className = "text-green-400 text-center mt-4";
        document.getElementById("uploadForm").reset();
      } else {
        status.innerHTML = "❌ Upload Failed";
        status.className = "text-red-400 text-center mt-4";
      }
    })
    .catch(err => {
      console.error(err);
      status.innerHTML = "❌ Upload Error";
      status.className = "text-red-400 text-center mt-4";
    });
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
